name: Validar portais dinâmicos (isolado)

on:
  push:
    branches: [main]
    paths:
      - "jobs-dashboard/sources/_http.py"
      - "jobs-dashboard/sources/digisystem.py"
      - "jobs-dashboard/sources/requested_careers.py"
      - "jobs-dashboard/sources/sankhya_senior.py"
      - "jobs-dashboard/validate_dynamic_portals.py"
      - "jobs-dashboard/tests/test_dynamic_portals.py"
      - "jobs-dashboard/tests/test_merge_dynamic_portals.py"
      - ".github/workflows/validate-dynamic-portals.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dynamic-portals
  cancel-in-progress: true

jobs:
  validate:
    name: Testar cinco fontes sem atualizar o catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: pip install -r jobs-dashboard/requirements.txt

      - name: Executar testes dos adaptadores
        run: python -m unittest discover -s jobs-dashboard/tests -p 'test_*dynamic_portals.py' -v

      - name: Consultar os cinco portais isoladamente
        env:
          PYTHONUNBUFFERED: "1"
        run: python jobs-dashboard/validate_dynamic_portals.py
