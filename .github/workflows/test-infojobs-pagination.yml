name: Testar paginação do InfoJobs

on:
  push:
    branches: [test/infojobs-pagination]

permissions:
  contents: read

jobs:
  testar-infojobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Selenium
        run: pip install -r jobs-dashboard/requirements.txt

      - name: Testar cobertura estadual até 500 vagas sem publicar dados
        env:
          INFOJOBS_MAX_JOBS: "500"
          INFOJOBS_MAX_PAGES: "30"
          INFOJOBS_MAX_SCROLLS: "4"
          INFOJOBS_RENDER_TIMEOUT: "50"
          PYTHONPATH: jobs-dashboard
        run: |
          python - <<'PY'
          from sources import infojobs

          states = [
              "sao-paulo", "rio-de-janeiro", "minas-gerais", "bahia", "parana",
              "rio-grande-do-sul", "pernambuco", "ceara", "santa-catarina", "goias",
              "distrito-federal", "para", "espirito-santo", "mato-grosso", "mato-grosso-do-sul",
              "amazonas", "maranhao", "paraiba", "rio-grande-do-norte", "alagoas", "piaui",
              "sergipe", "rondonia", "tocantins", "acre", "amapa", "roraima",
          ]
          known_ids = set()
          driver = infojobs._new_driver()
          try:
              driver.set_page_load_timeout(50)
              for state in states:
                  url = f"https://www.infojobs.com.br/empregos-em-{state}.aspx?campo=griddate&orden=desc"
                  driver.get(url)
                  infojobs._wait_for_results(driver, 40)
                  rows = infojobs._raw_cards(driver)
                  ids = infojobs._job_identifiers(rows)
                  known_ids.update(ids)
                  print(
                      f"ESTADO_INFOJOBS={state}; cartões={len(ids)}; "
                      f"acumulado={len(known_ids)}; url_final={driver.current_url}"
                  )
          finally:
              driver.quit()

          print(f"RESULTADO_INFOJOBS={len(known_ids)}")
          if len(known_ids) < 500:
              raise SystemExit(
                  f"A cobertura estadual retornou {len(known_ids)} vagas; esperado: 500 ou mais."
              )
          PY
