name: Atualizar vagas multiportal e publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/app.js"
      - "!docs/index.html"
      - "jobs-dashboard/**"
      - "busca_vagas/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # 08h17, 11h17, 15h17 e 20h17 no horário de Brasília/Fortaleza (UTC-3).
    - cron: "17 11,14,18,23 * * *"
    # Atualização semanal do catálogo Greenhouse: domingo às 04h37 (UTC-3).
    - cron: "37 7 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vagas-main-writer
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          # A queued push run otherwise checks out the event SHA, which may be
          # older than a data commit produced by the preceding serialized run.
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: pip install -r jobs-dashboard/requirements.txt

      - name: Atualizar catálogo brasileiro da Greenhouse
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 7 * * 0'
        continue-on-error: true
        run: python jobs-dashboard/discover_greenhouse_br.py --workers 32 --timeout 8

      - name: Descobrir novas empresas InHire
        continue-on-error: true
        run: node busca_vagas/harvest_inhire_public.js

      - name: Coletar a InHire
        continue-on-error: true
        run: node busca_vagas/build_public_inhire.js

      - name: Validar a coleta da InHire
        continue-on-error: true
        shell: bash
        run: |
          if [ -f jobs-dashboard/data/inhire/vagas.json ]; then
            node busca_vagas/validate_public_inhire.js
          else
            echo "A InHire será ignorada nesta execução; os outros portais continuarão."
          fi

      - name: Coletar e integrar o Nerdin
        continue-on-error: true
        run: python tools/update_nerdin.py

      - name: Coletar, normalizar e consolidar todos os portais
        env:
          SOLIDES_MAX_PAGES: "300"
          SOLIDES_WORKERS: "6"
          GEEKHUNTER_WORKERS: "4"
          ORACLE_WORKERS: "4"
          GREENHOUSE_WORKERS: "12"
          INFOJOBS_MAX_JOBS: "200"
          INFOJOBS_MAX_SCROLLS: "20"
        run: python jobs-dashboard/pipeline.py --max-age-months 2

      - name: Validar privacidade e integridade
        env:
          MIN_PUBLIC_JOBS: "500"
        run: python jobs-dashboard/validate_snapshot.py

      - name: Preservar histórico e fotografia pública
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-dashboard/data/greenhouse_br_companies.json jobs-dashboard/data/jobs.db docs/data/vagas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
          else
            git commit -m "Atualiza índice público de vagas [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
