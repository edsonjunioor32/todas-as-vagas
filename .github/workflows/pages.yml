name: Atualizar vagas multiportal e publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "jobs-dashboard/**"
      - "busca_vagas/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      resume_key:
        description: "Identificador da coleta anterior a ser retomada"
        required: false
        type: string
  schedule:
    # GitHub Actions usa UTC; Brasília/Fortaleza permanece em UTC-3.
    # Equivale a 08h00, 11h00, 15h00 e 20h00 em Brasília/Fortaleza.
    - cron: "0 11,14,18,23 * * *"
    # Atualização semanal do catálogo Greenhouse: domingo às 04h37 (UTC-3).
    - cron: "37 7 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Toda publicação do catálogo ou da interface passa pelo mesmo escritor.
  # Isso impede que um push publique a interface enquanto uma coleta grava
  # public-data/history-data e o Pages.
  group: catalog-publication
  cancel-in-progress: false

jobs:
  publicar-interface:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-fit]') && !contains(github.event.head_commit.message, '[isolated]')
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restaurar snapshots públicos
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/data/vagas.json ] && [ -f docs/data/fit.json ]; then
            echo "Snapshots públicos já estão no checkout."
            exit 0
          fi
          git fetch --no-tags origin public-data
          mkdir -p docs/data
          git archive origin/public-data data | tar -x -C docs
          test -s docs/data/vagas.json
          test -s docs/data/fit.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar dependências do analisador
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validar e preparar interface
        run: |
          npm run test:fit
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js
          python jobs-dashboard/validate_fit.py
          npm run prepare:fit

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  atualizar-e-publicar:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || (contains(github.event.head_commit.message, '[refresh-fit]') && !contains(github.event.head_commit.message, '[isolated]')))
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar navegador Chromium ARM64
        shell: bash
        run: bash tools/ensure_chromium.sh


      - name: Definir contexto de retomada
        id: collection-context
        shell: bash
        env:
          REQUESTED_RESUME_KEY: ${{ inputs.resume_key || '' }}
        run: |
          set -euo pipefail
          resume_key="${REQUESTED_RESUME_KEY:-}"
          if [ -z "$resume_key" ]; then
            resume_key="run-${GITHUB_RUN_ID}"
          fi
          mkdir -p jobs-dashboard/data/collection_checkpoints
          echo "resume_key=$resume_key" >> "$GITHUB_OUTPUT"
          echo "JOBS_COLLECTION_RESUME_KEY=$resume_key" >> "$GITHUB_ENV"
          echo "Coleta retomável: $resume_key"

      - name: Restaurar checkpoints da coleta
        uses: actions/cache/restore@v4
        with:
          path: jobs-dashboard/data/collection_checkpoints
          key: catalog-collection-v1-${{ steps.collection-context.outputs.resume_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            catalog-collection-v1-${{ steps.collection-context.outputs.resume_key }}-

      - name: Restaurar banco histórico
        id: jobs-cache
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/jobs.db
          key: jobs-db-v1-${{ github.run_id }}
          restore-keys: |
            jobs-db-v1-

      - name: Recuperar banco histórico de reserva
        if: steps.jobs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f jobs-dashboard/data/jobs.db ]; then
            echo "Banco histórico já está disponível."
            exit 0
          fi
          git fetch --no-tags origin history-data
          mkdir -p jobs-dashboard/data
          git archive origin/history-data data | tar -x -C jobs-dashboard
          # history-data is compressed because GitHub rejects blobs above 100 MiB.
          # This refresh validates the complete recovery path after the fix.
          if [ -f jobs-dashboard/data/jobs.db.gz ]; then
            gzip -dc jobs-dashboard/data/jobs.db.gz > jobs-dashboard/data/jobs.db
          fi
          test -s jobs-dashboard/data/jobs.db

      - name: Capturar fotografia anterior para proteção
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin public-data
          previous_dir="$(mktemp -d)"
          git archive origin/public-data data/vagas.json | tar -x -C "$previous_dir"
          cp "$previous_dir/data/vagas.json" .previous-vagas.json
          test -s .previous-vagas.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r jobs-dashboard/requirements.txt
          npm install --no-audit --no-fund --package-lock=false

      - name: Validar inicialização do Selenium e Chromium
        shell: bash
        run: |
          python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service

          options = webdriver.ChromeOptions()
          for argument in (
              "--headless=new", "--no-sandbox", "--disable-dev-shm-usage",
              "--disable-gpu", "--disable-extensions",
              "--disable-background-networking", "--disable-notifications",
          ):
              options.add_argument(argument)
          options.binary_location = os.environ["CHROME_BINARY"]
          driver = webdriver.Chrome(
              service=Service(executable_path=os.environ["CHROMEDRIVER_PATH"]),
              options=options,
          )
          try:
              driver.get("data:text/html,<title>selenium-smoke-ok</title>")
              if driver.title != "selenium-smoke-ok":
                  raise RuntimeError(f"título inesperado no smoke test: {driver.title!r}")
              print("Selenium iniciou o Chrome for Testing e abriu uma página headless.")
          finally:
              driver.quit()

      - name: Testar analisador de aderência
        run: |
          python -m unittest discover -s jobs-dashboard/tests -v
          python -m py_compile jobs-dashboard/notify_telegram.py
          npm run test:fit
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js

      - name: Atualizar catálogo brasileiro da Greenhouse
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 7 * * 0'
        continue-on-error: true
        run: python jobs-dashboard/discover_greenhouse_br.py --workers 6 --timeout 12

      - name: Descobrir novas empresas InHire
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-fit]')
        continue-on-error: true
        env:
          INHIRE_URLSCAN_PAGES: "20"
          INHIRE_COMMONCRAWL_INDEXES: "24"
        run: node busca_vagas/harvest_inhire_public.js

      - name: Restaurar cache de detalhes InHire
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/inhire
          key: inhire-details-v1-${{ github.run_id }}
          restore-keys: |
            inhire-details-v1-

      - name: Coletar a InHire
        continue-on-error: true
        env:
          INHIRE_DETAIL_TTL_HOURS: "24"
          INHIRE_DETAIL_WORKERS: "24"
        run: node busca_vagas/build_public_inhire.js

      - name: Validar a coleta da InHire
        continue-on-error: true
        shell: bash
        run: |
          if [ -f jobs-dashboard/data/inhire/vagas.json ]; then
            node busca_vagas/validate_public_inhire.js
          else
            echo "A InHire será ignorada nesta execução; os outros portais continuarão."
          fi

      - name: Restaurar cache de páginas Sólides
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/solides_cache
          key: solides-pages-v1-${{ github.run_id }}
          restore-keys: |
            solides-pages-v1-

      - name: Coletar, normalizar e consolidar todos os portais
        env:
          JOBS_SOURCE_WORKERS: "5"
          # Limit only rendered Chromium sessions; HTTP source concurrency is unchanged.
          COLLECTOR_BROWSER_WORKERS: "2"
          COLLECTOR_BROWSER_START_RETRIES: "3"
          COLLECTOR_BROWSER_SLOT_TIMEOUT: "90"
          SOLIDES_MAX_PAGES: "600"
          SOLIDES_WORKERS: "8"
          SOLIDES_PAGE_TIMEOUT: "30"
          SOLIDES_PAGE_RETRIES: "2"
          SOLIDES_CACHE_DIR: "jobs-dashboard/data/solides_cache"
          NERDIN_WORKERS: "6"
          GEEKHUNTER_WORKERS: "4"
          ORACLE_WORKERS: "4"
          GREENHOUSE_WORKERS: "4"
          INFOJOBS_MAX_JOBS: "2000"
          INFOJOBS_MAX_SCROLLS: "0"
          JOBS_COLLECTION_CHECKPOINT_DIR: "jobs-dashboard/data/collection_checkpoints"
        run: python jobs-dashboard/pipeline_fit.py --max-age-months 2

      - name: Salvar checkpoints da coleta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs-dashboard/data/collection_checkpoints
          key: catalog-collection-v1-${{ steps.collection-context.outputs.resume_key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validar privacidade e integridade
        env:
          MIN_PUBLIC_JOBS: "500"
          PREVIOUS_SNAPSHOT_PATH: ".previous-vagas.json"
          MIN_GUARDED_PUBLIC_JOBS: "10000"
          MIN_ALLOWED_PUBLIC_RATIO: "0.5"
          MAX_FAILED_SOURCES: "50"
          MAX_PRESERVED_PUBLIC_RATIO: "0.50"
          MAX_DUPLICATE_URL_RATIO: "0.005"
        run: |
          python jobs-dashboard/validate_snapshot.py
          python jobs-dashboard/validate_fit.py

      - name: Publicar banco histórico no ramo dedicado
        shell: bash
        run: |
          set -euo pipefail
          data_worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$data_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git fetch --no-tags origin history-data
          git worktree add --detach "$data_worktree" origin/history-data
          git -C "$data_worktree" switch -C history-data
          mkdir -p "$data_worktree/data"
          # Keep the large SQLite database below GitHub's per-file limit.
          gzip -n -c -9 jobs-dashboard/data/jobs.db > "$data_worktree/data/jobs.db.gz"
          git -C "$data_worktree" rm --ignore-unmatch data/jobs.db
          git -C "$data_worktree" add data/jobs.db.gz
          if git -C "$data_worktree" diff --cached --quiet; then
            echo "Ramo history-data já está atualizado."
          else
            git -C "$data_worktree" config user.name "github-actions[bot]"
            git -C "$data_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$data_worktree" commit -m "Atualiza histórico do pipeline"
            git -C "$data_worktree" push origin HEAD:history-data
          fi

      - name: Publicar snapshots no ramo dedicado
        shell: bash
        run: |
          set -euo pipefail
          data_worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$data_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git fetch --no-tags origin public-data || true
          if git show-ref --verify --quiet refs/remotes/origin/public-data; then
            git worktree add --detach "$data_worktree" origin/public-data
            git -C "$data_worktree" switch -C public-data
          else
            git worktree add --detach "$data_worktree" HEAD
            git -C "$data_worktree" switch --orphan public-data
            git -C "$data_worktree" rm -rf -- .
            git -C "$data_worktree" clean -fdx
          fi
          mkdir -p "$data_worktree/data"
          cp docs/data/vagas.json "$data_worktree/data/vagas.json"
          cp docs/data/fit.json "$data_worktree/data/fit.json"
          git -C "$data_worktree" add data/vagas.json data/fit.json
          if git -C "$data_worktree" diff --cached --quiet; then
            echo "Ramo public-data já está atualizado."
          else
            git -C "$data_worktree" config user.name "github-actions[bot]"
            git -C "$data_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$data_worktree" commit -m "Atualiza snapshots públicos"
            git -C "$data_worktree" push origin HEAD:public-data
          fi

      - name: Preservar histórico e fotografia pública
        shell: bash
        run: |
          cp jobs-dashboard/data/greenhouse_watchlist.json docs/data/greenhouse-watchlist.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add busca_vagas/inhire_tenants_seed.json jobs-dashboard/data/greenhouse_br_companies.json jobs-dashboard/data/greenhouse_watchlist.json docs/data/greenhouse-watchlist.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
          else
            git commit -m "Atualiza índice público de vagas [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preparar analisador para o site
        run: npm run prepare:fit

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

