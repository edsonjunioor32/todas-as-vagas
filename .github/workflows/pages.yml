name: Atualizar vagas multiportal e publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "jobs-dashboard/**"
      - "busca_vagas/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC: 12h17, 14h17, 18h17 e 23h17.
    # Equivale a 08h17, 11h17, 15h17 e 20h17 em Brasília/Fortaleza (UTC-3).
    - cron: "17 11,14,18,23 * * *"
    # Atualização semanal do catálogo Greenhouse: domingo às 04h37 (UTC-3).
    - cron: "37 7 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-fit]') && 'vagas-interface' || 'vagas-main-writer' }}
  cancel-in-progress: true

jobs:
  publicar-interface:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-fit]') && !contains(github.event.head_commit.message, '[isolated]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restaurar snapshots públicos
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/data/vagas.json ] && [ -f docs/data/fit.json ]; then
            echo "Snapshots públicos já estão no checkout."
            exit 0
          fi
          git fetch --no-tags origin public-data
          mkdir -p docs/data
          git archive origin/public-data data | tar -x -C docs
          test -s docs/data/vagas.json
          test -s docs/data/fit.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar dependências do analisador
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validar e preparar interface
        run: |
          npm run test:fit
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js
          python jobs-dashboard/validate_fit.py
          npm run prepare:fit

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  atualizar-e-publicar:
    if: github.event_name != 'push' || (contains(github.event.head_commit.message, '[refresh-fit]') && !contains(github.event.head_commit.message, '[isolated]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restaurar banco histórico
        id: jobs-cache
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/jobs.db
          key: jobs-db-v1-${{ github.run_id }}
          restore-keys: |
            jobs-db-v1-

      - name: Recuperar banco histórico de reserva
        if: steps.jobs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f jobs-dashboard/data/jobs.db ]; then
            echo "Banco histórico já está disponível."
            exit 0
          fi
          git fetch --no-tags origin history-data
          mkdir -p jobs-dashboard/data
          git archive origin/history-data data | tar -x -C jobs-dashboard
          test -s jobs-dashboard/data/jobs.db

      - name: Capturar fotografia anterior para proteção
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin public-data
          previous_dir="$(mktemp -d)"
          git archive origin/public-data data/vagas.json | tar -x -C "$previous_dir"
          cp "$previous_dir/data/vagas.json" .previous-vagas.json
          test -s .previous-vagas.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r jobs-dashboard/requirements.txt
          npm install --no-audit --no-fund --package-lock=false

      - name: Testar analisador de aderência
        run: |
          python -m unittest discover -s jobs-dashboard/tests -v
          python -m py_compile jobs-dashboard/notify_telegram.py
          npm run test:fit
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js

      - name: Atualizar catálogo brasileiro da Greenhouse
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 7 * * 0'
        continue-on-error: true
        run: python jobs-dashboard/discover_greenhouse_br.py --workers 6 --timeout 12

      - name: Descobrir novas empresas InHire
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-fit]')
        continue-on-error: true
        env:
          INHIRE_URLSCAN_PAGES: "20"
          INHIRE_COMMONCRAWL_INDEXES: "24"
        run: node busca_vagas/harvest_inhire_public.js

      - name: Restaurar cache de detalhes InHire
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/inhire
          key: inhire-details-v1-${{ github.run_id }}
          restore-keys: |
            inhire-details-v1-

      - name: Coletar a InHire
        continue-on-error: true
        env:
          INHIRE_DETAIL_TTL_HOURS: "24"
          INHIRE_DETAIL_WORKERS: "24"
        run: node busca_vagas/build_public_inhire.js

      - name: Validar a coleta da InHire
        continue-on-error: true
        shell: bash
        run: |
          if [ -f jobs-dashboard/data/inhire/vagas.json ]; then
            node busca_vagas/validate_public_inhire.js
          else
            echo "A InHire será ignorada nesta execução; os outros portais continuarão."
          fi

      - name: Restaurar cache de páginas Sólides
        uses: actions/cache@v4
        with:
          path: jobs-dashboard/data/solides_cache
          key: solides-pages-v1-${{ github.run_id }}
          restore-keys: |
            solides-pages-v1-

      - name: Coletar, normalizar e consolidar todos os portais
        env:
          JOBS_SOURCE_WORKERS: "5"
          SOLIDES_MAX_PAGES: "300"
          SOLIDES_WORKERS: "8"
          SOLIDES_PAGE_TIMEOUT: "30"
          SOLIDES_PAGE_RETRIES: "2"
          SOLIDES_CACHE_DIR: "jobs-dashboard/data/solides_cache"
          NERDIN_WORKERS: "6"
          GEEKHUNTER_WORKERS: "4"
          ORACLE_WORKERS: "4"
          GREENHOUSE_WORKERS: "4"
          INFOJOBS_MAX_JOBS: "2000"
          INFOJOBS_MAX_SCROLLS: "0"
        run: python jobs-dashboard/pipeline_fit.py --max-age-months 2

      - name: Validar privacidade e integridade
        env:
          MIN_PUBLIC_JOBS: "500"
          PREVIOUS_SNAPSHOT_PATH: ".previous-vagas.json"
          MIN_GUARDED_PUBLIC_JOBS: "10000"
          MIN_ALLOWED_PUBLIC_RATIO: "0.5"
        run: |
          python jobs-dashboard/validate_snapshot.py
          python jobs-dashboard/validate_fit.py

      - name: Publicar banco histórico no ramo dedicado
        shell: bash
        run: |
          set -euo pipefail
          data_worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$data_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git fetch --no-tags origin history-data
          git worktree add --detach "$data_worktree" origin/history-data
          git -C "$data_worktree" switch -C history-data
          mkdir -p "$data_worktree/data"
          cp jobs-dashboard/data/jobs.db "$data_worktree/data/jobs.db"
          git -C "$data_worktree" add data/jobs.db
          if git -C "$data_worktree" diff --cached --quiet; then
            echo "Ramo history-data já está atualizado."
          else
            git -C "$data_worktree" config user.name "github-actions[bot]"
            git -C "$data_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$data_worktree" commit -m "Atualiza histórico do pipeline"
            git -C "$data_worktree" push origin HEAD:history-data
          fi

      - name: Publicar snapshots no ramo dedicado
        shell: bash
        run: |
          set -euo pipefail
          data_worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$data_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git fetch --no-tags origin public-data || true
          if git show-ref --verify --quiet refs/remotes/origin/public-data; then
            git worktree add --detach "$data_worktree" origin/public-data
            git -C "$data_worktree" switch -C public-data
          else
            git worktree add --detach "$data_worktree" HEAD
            git -C "$data_worktree" switch --orphan public-data
            git -C "$data_worktree" rm -rf -- .
            git -C "$data_worktree" clean -fdx
          fi
          mkdir -p "$data_worktree/data"
          cp docs/data/vagas.json "$data_worktree/data/vagas.json"
          cp docs/data/fit.json "$data_worktree/data/fit.json"
          git -C "$data_worktree" add data/vagas.json data/fit.json
          if git -C "$data_worktree" diff --cached --quiet; then
            echo "Ramo public-data já está atualizado."
          else
            git -C "$data_worktree" config user.name "github-actions[bot]"
            git -C "$data_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$data_worktree" commit -m "Atualiza snapshots públicos"
            git -C "$data_worktree" push origin HEAD:public-data
          fi

      - name: Preservar histórico e fotografia pública
        shell: bash
        run: |
          cp jobs-dashboard/data/greenhouse_watchlist.json docs/data/greenhouse-watchlist.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add busca_vagas/inhire_tenants_seed.json jobs-dashboard/data/greenhouse_br_companies.json jobs-dashboard/data/greenhouse_watchlist.json docs/data/greenhouse-watchlist.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
          else
            git commit -m "Atualiza índice público de vagas [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preparar analisador para o site
        run: npm run prepare:fit

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
