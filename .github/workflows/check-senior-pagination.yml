name: Checagem isolada da paginação da Senior

on:
  push:
    branches:
      - codex/validate-senior-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pagination:
    runs-on: ubuntu-latest
    steps:
      - name: Checar o tamanho real de página
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://platform.senior.com.br/t/senior.com.br/bridge/1.0/"
              "anonymous/rest/hcm/careersmanagercandidate/queries/searchVacancies"
          )
          for size in (3, 100):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"page": 0, "size": size, "filter": {}, "match": {}}).encode(),
                  headers={
                      "Accept": "application/json;seniorx.version=2",
                      "Content-Type": "application/json",
                      "User-Agent": "todas-as-vagas-validation/1.0",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              print("size", size, "totalPages", payload.get("totalPages"), "totalElements", payload.get("totalElements"), "contents", len(payload.get("contents") or []))
          PY
