name: Catálogo — recuperar agenda perdida

on:
  schedule:
    # GitHub Actions usa UTC; o guard verifica os slots 08h, 11h, 15h e 20h BRT.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vagas-main-writer
  cancel-in-progress: false

env:
  CATCHUP_GRACE_MINUTES: "30"

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar e recuperar execução do catálogo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CATCHUP_GRACE_MINUTES: ${{ env.CATCHUP_GRACE_MINUTES }}
        run: python jobs-dashboard/catalog_catchup.py
