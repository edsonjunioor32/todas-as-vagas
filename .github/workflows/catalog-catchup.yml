name: Catálogo — recuperar agenda perdida

on:
  schedule:
    # GitHub Actions usa UTC; 06h15 UTC corresponde a 03h15 em Brasília.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vagas-main-writer
  cancel-in-progress: false

env:
  CATCHUP_GRACE_MINUTES: "30"

jobs:
  catchup:
    runs-on: [self-hosted, Linux, ARM64, vagas]
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar e recuperar execução do catálogo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CATCHUP_GRACE_MINUTES: ${{ env.CATCHUP_GRACE_MINUTES }}
        run: python jobs-dashboard/catalog_catchup.py

