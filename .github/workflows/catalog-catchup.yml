name: Catálogo — recuperar agenda perdida

on:
  schedule:
    # Verifica 38 minutos após cada horário principal, fora do minuto zero.
    - cron: "45 11,14,18,23 * * *"
  workflow_run:
    workflows:
      - "Atualizar vagas multiportal e publicar GitHub Pages"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

# Este controlador não publica dados: consulta runs, registra o alerta e aciona
# a publicação self-hosted. A fila é independente do runner da VPS.
concurrency:
  group: catalog-catchup-control
  queue: max

env:
  CATCHUP_GRACE_MINUTES: "30"
  CATCHUP_QUEUE_ALERT_MINUTES: "20"
  CATCHUP_ACTIVE_ALERT_MINUTES: "120"

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar, alertar e recuperar o catálogo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          CATCHUP_GRACE_MINUTES: ${{ env.CATCHUP_GRACE_MINUTES }}
          CATCHUP_QUEUE_ALERT_MINUTES: ${{ env.CATCHUP_QUEUE_ALERT_MINUTES }}
          CATCHUP_ACTIVE_ALERT_MINUTES: ${{ env.CATCHUP_ACTIVE_ALERT_MINUTES }}
        run: python jobs-dashboard/catalog_catchup.py
