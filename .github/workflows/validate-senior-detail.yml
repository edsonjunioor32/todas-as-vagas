name: Validação isolada dos detalhes da Senior

on:
  push:
    branches:
      - codex/validate-senior-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-senior-detail:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar detalhe público da vaga
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://platform.senior.com.br/t/senior.com.br/bridge/1.0/"
              "anonymous/rest/hcm/careersmanagercandidate/queries/findVacancyById"
          )
          vacancy_id = "a8f2a293-46cd-4279-a4d5-6f0d51713151"
          request = urllib.request.Request(
              url,
              data=json.dumps({"id": vacancy_id}).encode(),
              headers={
                  "Accept": "application/json;seniorx.version=2",
                  "Content-Type": "application/json",
                  "User-Agent": "todas-as-vagas-validation/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY
