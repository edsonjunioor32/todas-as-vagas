name: Descobrir empresas Greenhouse com vagas no Brasil

on:
  workflow_dispatch:
  schedule:
    # Domingo às 04h37 no horário de Brasília/Fortaleza (07h37 UTC).
    - cron: "37 7 * * 0"

permissions:
  contents: write

concurrency:
  group: greenhouse-discovery
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar páginas e manter somente empresas com vagas brasileiras
        run: python jobs-dashboard/discover_greenhouse_br.py --workers 32 --timeout 8

      - name: Atualizar catálogo brasileiro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-dashboard/data/greenhouse_br_companies.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no catálogo Greenhouse brasileiro."
          else
            git commit -m "Atualiza empresas Greenhouse com vagas no Brasil"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
