name: CI - Analisador de Aderência

on:
  pull_request:
    paths:
      - "docs/aderencia/**"
      - "docs/data/fit*.json"
      - "docs/fit-entry.*"
      - "jobs-dashboard/fit_requirements.py"
      - "jobs-dashboard/pipeline_fit.py"
      - "jobs-dashboard/validate_fit.py"
      - "jobs-dashboard/tests/**"
      - "tools/fit-engine.test.mjs"
      - "tools/prepare_fit_assets.py"
      - "package.json"
      - ".github/workflows/fit-ci.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/aderencia/**"
      - "docs/data/fit*.json"
      - "docs/fit-entry.*"
      - "jobs-dashboard/fit_requirements.py"
      - "jobs-dashboard/pipeline_fit.py"
      - "jobs-dashboard/validate_fit.py"
      - "jobs-dashboard/tests/**"
      - "tools/fit-engine.test.mjs"
      - "tools/prepare_fit_assets.py"
      - "package.json"
      - ".github/workflows/fit-ci.yml"

permissions:
  contents: read

jobs:
  test-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt
      - name: Instalar dependências
        run: |
          pip install -r jobs-dashboard/requirements.txt
          npm install --no-audit --no-fund --package-lock=false
      - name: Testar Python
        run: python -m unittest discover -s jobs-dashboard/tests -v
      - name: Testar motor de aderência
        run: npm run test:fit
      - name: Validar JavaScript
        run: |
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js
      - name: Validar índice público
        run: python jobs-dashboard/validate_fit.py
      - name: Preparar artifact estático
        run: npm run prepare:fit
      - name: Verificar integração da página principal
        run: |
          grep -q 'fit-entry.css' docs/index.html
          grep -q 'fit-entry.js' docs/index.html
          grep -q 'Analisar meu currículo' docs/index.html
          test -s docs/vendor/pdf.mjs
          test -s docs/vendor/pdf.worker.mjs
          test -s docs/vendor/mammoth.browser.min.js
