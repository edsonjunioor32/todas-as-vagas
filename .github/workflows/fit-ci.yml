name: CI - Analisador de Aderência

on:
  pull_request:
    paths:
      - "docs/aderencia/**"
      - "docs/data/fit*.json"
      - "docs/fit-entry.*"
      - "jobs-dashboard/fit_requirements.py"
      - "jobs-dashboard/pipeline_fit.py"
      - "jobs-dashboard/validate_fit.py"
      - "jobs-dashboard/tests/**"
      - "tools/fit-engine.test.mjs"
      - "tools/prepare_fit_assets.py"
      - "tools/preview_server.ps1"
      - "tools/iniciar-preview.bat"
      - "package.json"
      - ".github/workflows/fit-ci.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/aderencia/**"
      - "docs/data/fit*.json"
      - "docs/fit-entry.*"
      - "jobs-dashboard/fit_requirements.py"
      - "jobs-dashboard/pipeline_fit.py"
      - "jobs-dashboard/validate_fit.py"
      - "jobs-dashboard/tests/**"
      - "tools/fit-engine.test.mjs"
      - "tools/prepare_fit_assets.py"
      - "package.json"
      - ".github/workflows/fit-ci.yml"

permissions:
  contents: read

jobs:
  test-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar snapshots públicos
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/data/fit.json ]; then
            echo "Snapshot de aderência já está no checkout."
            exit 0
          fi
          git fetch --no-tags origin public-data
          mkdir -p docs/data
          git archive origin/public-data data | tar -x -C docs
          test -s docs/data/fit.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt
      - name: Instalar dependências
        run: |
          pip install -r jobs-dashboard/requirements.txt
          npm install --no-audit --no-fund --package-lock=false
      - name: Testar Python
        run: python -m unittest discover -s jobs-dashboard/tests -v
      - name: Testar motor de aderência
        run: npm run test:fit
      - name: Validar JavaScript
        run: |
          node --check docs/fit-entry.js
          node --input-type=module --check < docs/aderencia/fit-engine.js
          node --input-type=module --check < docs/aderencia/app.js
      - name: Validar índice público
        run: python jobs-dashboard/validate_fit.py
      - name: Preparar artifact estático
        run: npm run prepare:fit
      - name: Verificar que o recurso está oculto no portal
        run: |
          ! grep -q 'fit-entry.css' docs/index.html
          ! grep -q 'fit-entry.js' docs/index.html
          ! grep -q 'Analisar meu currículo' docs/index.html
          ! grep -q 'hero-fit-cta' docs/index.html
          test -s docs/vendor/pdf.mjs
          test -s docs/vendor/pdf.worker.mjs
          test -s docs/vendor/mammoth.browser.min.js
      - name: Montar pacote de preview local
        run: |
          mkdir -p preview/site
          cp -a docs/. preview/site/
          cp tools/iniciar-preview.bat tools/preview_server.ps1 preview/
          cat > preview/LEIA-ME.txt <<'EOF'
          PREVIEW LOCAL - TODAS AS VAGAS

          1. Extraia todo o ZIP para uma pasta.
          2. Execute iniciar-preview.bat.
          3. O navegador abrirá http://localhost:8765/.
          4. A página técnica de aderência permanece no pacote para desenvolvimento, mas está oculta do portal público.
          5. Para encerrar, feche a janela preta do preview ou pressione Ctrl+C nela.

          O currículo usado no teste fica somente no navegador local.
          Nenhum dado é enviado ao GitHub ou ao site público.
          EOF
      - name: Disponibilizar preview para teste
        uses: actions/upload-artifact@v4
        with:
          name: todas-as-vagas-preview
          path: preview
          if-no-files-found: error
          retention-days: 3
