name: LinkedIn Weekly Best Jobs Digest

on:
  schedule:
    # 22:16 UTC = 19:16 BRT (Horário especial da edição executiva de Sexta-feira com ticks múltiplos anti-concorrência)
    - cron: '16 22 * * 5'
    - cron: '26 22 * * 5'
    - cron: '36 22 * * 5'
    - cron: '51 22 * * 5'
    - cron: '06 23 * * 5'
  workflow_run:
    workflows:
      - "Atualizar vagas multiportal e publicar GitHub Pages"
      - "Catálogo — recuperar agenda perdida"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar postagem semanal mesmo se já tiver postado esta semana'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Simular postagem sem enviar para o Webhook do Make'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-weekly-digest
  cancel-in-progress: false

jobs:
  publish-weekly-digest:
    name: Curar e Publicar Melhores da Semana no LinkedIn
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar Curadoria e Disparo da Edição Semanal
        env:
          PYTHONPATH: tools
          MAKE_LINKEDIN_WEBHOOK_URL: ${{ secrets.MAKE_LINKEDIN_WEBHOOK_URL || 'https://hook.us2.make.com/pmtttsu5fw61y2sjhyevac82zw74mwx0' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python tools/publish_linkedin_weekly.py $FLAGS

      - name: Persistir estado do digest semanal no repositório
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/linkedin_digest_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(linkedin): atualizar estado de postagem semanal [skip ci]"
            git push origin main
          fi
