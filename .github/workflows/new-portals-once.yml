name: Atualização única dos seis novos portais

on:
  push:
    branches: [main]
    paths:
      - ".github/new-portals-once-20260818"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vagas-main-writer
  cancel-in-progress: false

jobs:
  atualizar-novos-portais:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: pip install -r jobs-dashboard/requirements.txt

      - name: Coletar somente os seis novos portais
        run: >-
          python jobs-dashboard/pipeline.py
          --sources providerit,fiserv,metalfrio,revolut,inlog,nestle
          --max-age-months 2

      - name: Validar privacidade e integridade
        env:
          MIN_PUBLIC_JOBS: "500"
        run: python jobs-dashboard/validate_snapshot.py

      - name: Preservar histórico e fotografia pública
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-dashboard/data/jobs.db docs/data/vagas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
          else
            git commit -m "Atualiza somente os seis novos portais [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
