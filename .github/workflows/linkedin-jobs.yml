name: Coleta Diária LinkedIn (Candidatura Simplificada)

on:
  schedule:
    # Roda diariamente às 10:00 UTC (07:00 da manhã no horário de Brasília / Fortaleza)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      results_per_term:
        description: "Quantidade de vagas desejadas por termo pesquisado"
        required: false
        default: "25"
        type: string
      hours_old:
        description: "Janela máxima de publicação em horas (720 = 30 dias)"
        required: false
        default: "720"
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-jobs-collector
  cancel-in-progress: true

jobs:
  collect-linkedin:
    name: Coletar vagas LinkedIn Easy Apply
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências da coleta
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas

      - name: Executar Coleta Isolada do LinkedIn
        run: |
          RESULTS="${{ inputs.results_per_term || '25' }}"
          HOURS="${{ inputs.hours_old || '720' }}"
          python tools/collect_linkedin.py \
            --results-per-term "$RESULTS" \
            --hours-old "$HOURS" \
            --output docs/data/linkedin_vagas.json

      - name: Validar snapshot antes da publicação
        env:
          LINKEDIN_SNAPSHOT_MAX_AGE_HOURS: "36"
          LINKEDIN_MAX_AGE_DAYS: "30"
        run: |
          PYTHONPATH=jobs-dashboard python - <<'PY'
          from sources import linkedin

          rows = linkedin.fetch()
          print(f"Snapshot LinkedIn validado: {len(rows)} vagas brasileiras Easy Apply.")
          PY

      - name: Preservar artefato para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-snapshot
          path: docs/data/linkedin_vagas.json
          retention-days: 7

      - name: Publicar snapshot coletado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/linkedin_vagas.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados do LinkedIn."
          else
            git commit -m "chore(jobs): atualizar vagas do LinkedIn (candidatura simplificada) [linkedin-refresh]"
            git push origin main
          fi
