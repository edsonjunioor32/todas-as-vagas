name: Coleta Diária LinkedIn (Vagas Públicas)

on:
  # Um push que altera o coletor dispara uma execução imediata para que uma
  # correção não espere a próxima janela agendada. O commit do snapshot usa
  # [linkedin-refresh] e é ignorado pelo próprio job para evitar recursão.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/linkedin-jobs.yml"
      - "tools/collect_linkedin.py"
      - "jobs-dashboard/sources/linkedin.py"
  schedule:
    # Executa às 07h e 19h de Brasília/Fortaleza (10h e 22h UTC).
    # A segunda coleta do dia captura vagas publicadas após a primeira janela.
    - cron: "0 10,22 * * *"
  workflow_dispatch:
    inputs:
      results_limit:
        description: "Vagas solicitadas na varredura geral; cada consulta é limitada a 1.000 e a execução a 1.200 anúncios únicos."
        required: false
        default: "1000"
        type: string
      remote_results_limit:
        description: "Vagas solicitadas na busca remota; cada consulta é limitada a 1.000 e o total da execução a 1.200 anúncios únicos."
        required: false
        default: "200"
        type: string
      hours_old:
        description: "Janela máxima de publicação em horas (1440 = 60 dias)"
        required: false
        default: "1440"
        type: string

permissions:
  contents: write

concurrency:
  # Compartilha o mesmo escritor do catálogo para serializar o commit do
  # snapshot do LinkedIn e a publicação em public-data.
  group: catalog-publication
  cancel-in-progress: false

jobs:
  collect-linkedin:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[linkedin-refresh]')
    name: Coletar vagas públicas LinkedIn
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências da coleta
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy==1.4.1 pandas

      - name: Executar coleta pública do LinkedIn
        run: |
          RESULTS="${{ inputs.results_limit || '1000' }}"
          REMOTE_RESULTS="${{ inputs.remote_results_limit || '200' }}"
          HOURS="${{ inputs.hours_old || '1440' }}"
          python tools/collect_linkedin.py \
            --results-limit "$RESULTS" \
            --remote-results-limit "$REMOTE_RESULTS" \
            --hours-old "$HOURS" \
            --output docs/data/linkedin_vagas.json

      - name: Validar snapshot antes da publicação
        env:
          LINKEDIN_SNAPSHOT_MAX_AGE_HOURS: "36"
          LINKEDIN_MAX_AGE_DAYS: "60"
        run: |
          PYTHONPATH=jobs-dashboard python - <<'PY'
          from sources import linkedin

          rows = linkedin.fetch()
          print(f"Snapshot LinkedIn validado: {len(rows)} vagas brasileiras públicas.")
          PY

      - name: Preservar artefato para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-snapshot
          path: docs/data/linkedin_vagas.json
          retention-days: 7

      - name: Publicar snapshot coletado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/linkedin_vagas.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados do LinkedIn."
          else
            git commit -m "chore(linkedin): atualizar vagas públicas do LinkedIn [linkedin-refresh]"
            git push origin main
          fi

          # GITHUB_TOKEN não inicia outro workflow por um simples git push.
          # Enviamos um evento explícito para que o Pages recalcule o catálogo
          # e publique o snapshot atualizado nesta mesma execução.
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"linkedin_refresh"}'
