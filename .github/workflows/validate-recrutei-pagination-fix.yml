name: Validar correção de paginação Recrutei

on:
  push:
    branches:
      - fix/recrutei-complete-pagination-20260905
    paths:
      - "jobs-dashboard/sources/recrutei.py"
      - "jobs-dashboard/tests/test_recrutei_pagination.py"
      - ".github/scripts/patch_recrutei_discovery.py"
      - ".github/workflows/validate-recrutei-pagination-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-recrutei-pagination-fix
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar fallback de descoberta
        run: python .github/scripts/patch_recrutei_discovery.py

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-dashboard/requirements.txt

      - name: Instalar dependências
        run: pip install -r jobs-dashboard/requirements.txt

      - name: Executar regressões Recrutei
        run: |
          python -m py_compile jobs-dashboard/sources/recrutei.py
          python -m unittest discover -s jobs-dashboard/tests -p 'test_recrutei_pagination.py' -v
          python -m unittest discover -s jobs-dashboard/tests -p 'test_new_sources.py' -v

      - name: Coleta real isolada do Recrutei
        env:
          PYTHONUNBUFFERED: "1"
          JOBS_SOURCE_WORKERS: "1"
        run: python jobs-dashboard/pipeline.py --dry-run --sources recrutei --max-age-months 2

      - name: Persistir correção validada na branch
        shell: bash
        run: |
          set -euo pipefail
          git add jobs-dashboard/sources/recrutei.py
          if git diff --cached --quiet; then
            echo "Fonte Recrutei já contém o fallback validado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Torna paginação Recrutei independente do contador renderizado"
          git push origin HEAD:fix/recrutei-complete-pagination-20260905
