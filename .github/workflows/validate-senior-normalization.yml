name: Validação isolada da normalização Senior

on:
  push:
    branches:
      - codex/validate-senior-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Executar testes dos portais
        run: python -m unittest discover -s jobs-dashboard/tests -p "test_*.py" -v
      - name: Validar uma vaga Senior real
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "jobs-dashboard")
          from sources.sankhya_senior import (
              _senior_contract_types,
              _senior_detail_vacancy,
              _senior_work_model,
          )

          vacancy = _senior_detail_vacancy("a8f2a293-46cd-4279-a4d5-6f0d51713151")
          print({
              "hiringRegime": vacancy.get("hiringRegime"),
              "jobModel": vacancy.get("jobModel"),
              "experience": vacancy.get("experience"),
              "pcd": vacancy.get("pcd"),
          })
          assert _senior_contract_types(vacancy.get("hiringRegime")) == ["CLT"]
          assert _senior_work_model(vacancy.get("jobModel")) == "on-site"
          PY
