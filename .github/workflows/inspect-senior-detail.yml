name: Inspeção isolada dos detalhes da Senior

on:
  push:
    branches:
      - codex/validate-senior-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-senior-detail:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar página pública da vaga
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request

          vacancy_id = "a8f2a293-46cd-4279-a4d5-6f0d51713151"
          urls = [
              f"https://www.portaldetalentos.senior.com.br/vacancy/{vacancy_id}",
              f"https://vemprasenior.portaldetalentos.senior.com.br/vacancy/{vacancy_id}",
          ]
          for url in urls:
              print("=== URL", url, "===")
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "text/html,application/xhtml+xml",
                      "User-Agent": "Mozilla/5.0 (compatible; todas-as-vagas-validation/1.0)",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("status:", response.status, "final_url:", response.geturl(), "bytes:", len(body))
              except Exception as error:
                  print("error:", repr(error))
                  continue
              print("title:", re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S).group(1).strip() if re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S) else "")
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', body, re.I)
              print("script_count:", len(scripts))
              for script in scripts:
                  print("script:", script)
              for pattern in (r'https?://[^"\']+', r'/(?:api|bridge|queries|vacanc)[^"\']+'):
                  matches = sorted(set(re.findall(pattern, body, re.I)))
                  for match in matches[:50]:
                      print("match:", match[:500])
          PY
