name: Notificar novas vagas no Telegram

on:
  workflow_dispatch:
    inputs:
      previous_ref:
        description: "Ref opcional do snapshot anterior; vazio usa os dois últimos snapshots"
        required: false
        type: string
      resend_from_ref:
        description: "Reenvio pontual: ref anterior ao lote que deve ser reenviado"
        required: false
        type: string
  push:
    paths:
      - ".github/telegram-trigger"
  workflow_run:
    workflows: ["Atualizar vagas multiportal e publicar GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: telegram-notification
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identificar snapshot anterior
        id: baseline
        shell: bash
        env:
          INPUT_PREVIOUS_REF: ${{ inputs.previous_ref }}
          INPUT_RESEND_FROM_REF: ${{ inputs.resend_from_ref }}
          RESEND_REF_FILE: .github/telegram_resend_from_ref
        run: |
          previous_ref="$INPUT_PREVIOUS_REF"
          resend_from_ref="$INPUT_RESEND_FROM_REF"
          if [ -z "$resend_from_ref" ] && [ -f "$RESEND_REF_FILE" ]; then
            resend_from_ref="$(tr -d '[:space:]' < "$RESEND_REF_FILE")"
          fi
          if [ -z "$previous_ref" ]; then
            previous_ref="$(git log --format='%H' -- docs/data/vagas.json | sed -n '2p')"
          fi
          if [ -z "$previous_ref" ]; then
            echo "Não foi possível identificar o snapshot anterior." >&2
            exit 1
          fi
          echo "previous_ref=$previous_ref" >> "$GITHUB_OUTPUT"
          echo "resend_from_ref=$resend_from_ref" >> "$GITHUB_OUTPUT"
          echo "Snapshot anterior: $previous_ref"
          if [ -n "$resend_from_ref" ]; then
            echo "Reenvio pontual a partir de: $resend_from_ref"
          fi

      - name: Enviar vagas novas ao Telegram
        id: send
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram não configurado: verifique TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID." >&2
            exit 1
          fi
          python jobs-dashboard/notify_telegram.py \
            --state-file .github/telegram_state.json \
            --previous-ref "${{ steps.baseline.outputs.previous_ref }}" \
            --resend-from-ref "${{ steps.baseline.outputs.resend_from_ref }}"

      - name: Persistir estado das notificações
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.send.outcome }}" = "success" ] && [ -f .github/telegram_resend_from_ref ]; then
            git rm .github/telegram_resend_from_ref
          fi
          if [ -f .github/telegram_state.json ]; then
            git add .github/telegram_state.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Estado do Telegram sem alterações."
          else
            git commit -m "Atualiza estado das notificações Telegram [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Encerrar com falha se o envio falhou
        if: steps.send.outcome == 'failure'
        run: exit 1
