name: Atualizar apenas as vagas do Nerdin

on:
  push:
    branches: [main]
    paths:
      - "tools/update_nerdin.py"
      - ".github/workflows/update-nerdin.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vagas-main-writer
  cancel-in-progress: false

jobs:
  atualizar-nerdin-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar e integrar apenas as vagas do Nerdin
        run: python tools/update_nerdin.py

      - name: Validar a fotografia pública
        env:
          MIN_PUBLIC_JOBS: "500"
        run: python jobs-dashboard/validate_snapshot.py

      - name: Preservar a nova fotografia
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-dashboard/data/jobs.db docs/data/vagas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
          else
            git commit -m "Atualiza vagas do Nerdin [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
